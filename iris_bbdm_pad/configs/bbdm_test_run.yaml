# Quick dry-run config: 3 epochs only. DO NOT USE FOR REAL TRAINING.
runner: "BBDMRunner"

training:
  n_epochs: 3
  n_steps: 10000          # Well above 3 epochs * ~877 iters = 2631 steps
  save_interval: 1        # Save checkpoint every epoch
  sample_interval: 1      # Sample once per epoch (sample_interval * epoch_length steps)
  validation_interval: 1  # Validate every epoch
  accumulate_grad_batches: 1  # No accumulation for speed

testing:
  clip_denoised: False
  sample_num: 1

data:
  dataset_name: 'iris_bbdm_dryrun'
  dataset_type: 'custom_aligned'
  dataset_config:
    dataset_path: 'iris_bbdm_pad/data/bonafide_pairs'
    image_size: 256
    channels: 3
    to_normal: True
    flip: False
  train:
    batch_size: 16
    shuffle: True
  val:
    batch_size: 16
    shuffle: False
  test:
    batch_size: 16

model:
  model_name: "LBBDM-f4"
  model_type: "LBBDM"
  latent_before_quant_conv: False
  normalize_latent: False
  only_load_latent_mean_std: False

  EMA:
    use_ema: True
    ema_decay: 0.995
    update_ema_interval: 8
    start_ema_step: 100    # Low so EMA kicks in during test run

  CondStageParams:
    n_stages: 2
    in_channels: 3
    out_channels: 3

  VQGAN:
    params:
      ckpt_path: 'BBDM/resources/vq-f4/model.ckpt'
      embed_dim: 3
      n_embed: 8192
      ddconfig:
        double_z: false
        z_channels: 3
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: [1, 2, 4]
        num_res_blocks: 2
        attn_resolutions: []
        dropout: 0.0
      lossconfig:
        target: torch.nn.Identity

  BB:
    optimizer:
      weight_decay: 0.000
      optimizer: 'Adam'
      lr: 1.0e-4
      beta1: 0.9

    lr_scheduler:
      factor: 0.5
      patience: 3000
      threshold: 0.0001
      cooldown: 3000
      min_lr: 5.0e-7

    params:
      mt_type: 'linear'
      objective: 'grad'
      loss_type: 'l1'

      skip_sample: True
      sample_type: 'linear'
      sample_step: 200

      num_timesteps: 1000
      eta: 1.0
      max_var: 1.0

      UNetParams:
        image_size: 64
        in_channels: 3
        model_channels: 128
        out_channels: 3
        num_res_blocks: 2
        attention_resolutions: [32, 16, 8]
        channel_mult: [1, 2, 3, 4]
        conv_resample: True
        dims: 2
        num_heads: 8
        num_head_channels: 64
        use_scale_shift_norm: True
        resblock_updown: True
        use_spatial_transformer: False
        context_dim:
        condition_key: "nocond"
